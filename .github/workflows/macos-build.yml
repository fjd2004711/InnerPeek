name: macOS Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' InnerPeek/InnerPeek-Info.plist)
          test "$TAG_VERSION" = "$APP_VERSION"

      - name: Build InnerPeek
        run: |
          xcodebuild \
            -project InnerPeek.xcodeproj \
            -scheme InnerPeek \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/InnerPeekDerivedData" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Create DMG and checksum
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/InnerPeekDerivedData/Build/Products/Release/InnerPeek.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' InnerPeek/InnerPeek-Info.plist)
          OUTPUT_DIR="$GITHUB_WORKSPACE/dist"
          DMG_ROOT="$RUNNER_TEMP/InnerPeekDMG"
          DMG_PATH="$OUTPUT_DIR/InnerPeek-${VERSION}-macOS.dmg"

          test -d "$APP_PATH"
          test -f "$APP_PATH/Contents/Resources/Assets.car"
          codesign --verify --deep --strict "$APP_PATH"
          mkdir -p "$OUTPUT_DIR"
          mkdir -p "$DMG_ROOT"
          ditto "$APP_PATH" "$DMG_ROOT/InnerPeek.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create \
            -volname "InnerPeek ${VERSION}" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "$DMG_PATH"
          (cd "$OUTPUT_DIR" && shasum -a 256 "$(basename "$DMG_PATH")" > SHA256SUMS)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InnerPeek-macOS-${{ github.run_number }}
          path: |
            dist/InnerPeek-*-macOS.dmg
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the build from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: InnerPeek-macOS-${{ github.run_number }}
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: InnerPeek ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/SHA256SUMS
